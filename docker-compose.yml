services:
  backend:
    build: ./backend
    container_name: kspec-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/kspec_garage
      - JWT_SECRET=kspec_super_secreto_2026
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: kspec-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: